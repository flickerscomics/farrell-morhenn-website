milestones:
  - year: "2016"
    title: The firm is founded
    description: The firm opens as a two-attorney criminal defence practice in Little Seoul.
  - year: "2018"
    title: Civil and business practices open
    description: The firm adds civil litigation and business law to its criminal defence work.
  - year: "2019"
    title: Family practice opens
    description: The firm adds family law, divorce and custody work.
  - year: "2021"
    title: Move to Pillbox Hill
    description: The firm moves to the Arcadius Business Center to accommodate a growing team.
  - year: "2024"
    title: Blaine County clinics
    description: Monthly walk-in legal clinics begin in Paleto Bay.

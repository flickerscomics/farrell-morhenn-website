questions:
  - category: services
    question: What kinds of matters does the firm handle?
    answer: Our attorneys handle criminal defence, civil litigation, personal injury, family and business matters, property disputes and more. See the [practice areas](/practice-areas) page for the full list.
  - category: services
    question: Do you take every case?
    answer: No. We review each enquiry and accept matters where we believe we can genuinely help. If we cannot take a matter, we will tell you promptly.
  - category: consultations
    question: How do I request a consultation?
    answer: Call, email or visit the office (see [contact](/contact)). Tell us which attorney you would like to see, if any, and when you are available. A consultation is confirmed once a member of staff agrees a time with you.
  - category: consultations
    question: Is there a charge for an initial consultation?
    answer: Initial consultations are free of charge. Any fee for further work is agreed with you before it starts.
  - category: contacting
    question: What should I tell the office when I first get in touch?
    answer: A short summary of what happened, the people involved, any important dates and what you would like us to help with. General details are enough at this stage.
  - category: contacting
    question: Should I send documents straight away?
    answer: Only once an attorney asks for them. Please do not send original documents or confidential material until the firm has confirmed it can act for you.
  - category: contacting
    question: What happens after I contact the office?
    answer: A member of staff reviews every enquiry, usually within one business day, and contacts you by the method you used to reach us.
  - category: appointments
    question: What time zone are appointment times in?
    answer: All times on this website are Pacific Time, the time zone of our Los Santos office.
  - category: appointments
    question: Can I change or cancel an appointment?
    answer: Yes. Contact the office and we will reschedule or cancel it for you.
  - category: attorneys
    question: How do I contact a particular attorney?
    answer: Each attorney's profile on the [people](/people) page explains how to reach them. You can also ask reception to put you in touch.
  - category: careers
    question: How do I apply to work at the firm?
    answer: Open vacancies are listed on the [careers](/careers) page, each with instructions on how to apply. You are also welcome to send a general application if no current vacancy fits.
  - category: careers
    question: Will I hear back about my application?
    answer: Yes. Every application is reviewed by a partner and receives a decision.
  - category: services
    practiceArea: criminal-defence
    question: Should I speak to the police before talking to a lawyer?
    answer: You are entitled to remain silent and to ask for an attorney before answering questions. It is almost always sensible to speak to defence counsel first.
  - category: services
    practiceArea: personal-injury
    question: How long do I have to bring a personal injury claim?
    answer: Strict time limits apply under San Andreas law. Contact us as early as possible so evidence can be preserved and deadlines are not missed.
  - category: services
    practiceArea: civil-litigation
    question: Can you help if the other side has already filed in court?
    answer: Yes. Bring any papers you have been served to your consultation so we can check the deadlines.
